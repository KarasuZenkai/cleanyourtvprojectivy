name: Fallo en este fork
description: Reporta un problema con el script o la documentación para Projectivy.
labels: [bug]
body:
  - type: input
    id: tv
    attributes:
      label: Modelo, Android y compilación
      placeholder: TCL 75A400 Pro, Android 14, UTT2.250416.001 AU02
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Conexión ADB
        - Cambio de HOME a Projectivy
        - Restauración del HOME original
        - Documentación
        - Lista de debloat heredada
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado observado y esperado
      description: Omite direcciones IP, nombres de red, claves ADB e identificadores privados.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
