name: Experiencia en otro televisor
description: Comparte datos comprobados de Projectivy como HOME en otro modelo.
title: "[TV] Marca y modelo"
labels: [tv-list]
body:
  - type: input
    id: model
    attributes:
      label: Modelo exacto
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Versión de Android y compilación
    validations:
      required: true
  - type: textarea
    id: home
    attributes:
      label: Componentes HOME y paquetes desactivados
      description: Indica los valores observados antes y después. No copies una lista de otro modelo.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Comprobaciones realizadas
      description: Inicio, Fuentes, Ajustes, reinicio completo y red Wi-Fi.
